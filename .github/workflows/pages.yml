name: Deploy Web demo to GitHub Pages

# 合规卫士有两个界面：
#   1. 桌面端（Python + CustomTkinter）—— 需要下载安装，只有 Windows 能用；
#   2. Web 端（web/ 目录）—— **零构建纯静态**，12 个文件全部相对路径引用，
#      打开就能用，还能装到手机主屏、断网也能跑。
#
# 给 Web 端一个永久地址，是为了把「先试试」这一步的摩擦降到最低：
# 不用下载、不用装 Python、不用注册，点开就是。
#
# 为什么不用 npm build：web/ 本来就没有构建步骤（没有 package.json）。
# 硬塞一个构建反而多一层可能坏的地方 —— 直接把目录当产物上传。

on:
  push:
    branches: [main]
    paths:
      # 改代码/改词库/改样式才重新部署；改文档不必触发
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 连续推送时只跑最后一次，避免旧产物覆盖新产物
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 先探一下这个仓库到底有没有启用 Pages。
  #
  # 为什么需要这一步：GITHUB_TOKEN **无权创建 Pages 站点**（实测：即使给
  # configure-pages 传 enablement: true，也会在 "Get Pages site failed"
  # 处失败）。仓库第一次要用 Pages，只能由管理员在网页上启用一次。
  #
  # 但"没启用"是**环境缺失**，不是代码问题 —— 让它把 workflow 判红，结果是
  # 每次 push 都挂一个红灯。红习惯之后，真出问题就没人看了（同一个原则写在了
  # scripts/sync_to_blog.py 里：目标目录不存在就跳过，不判失败）。
  # 所以这里探测后**优雅跳过**，并留一条 notice 告诉人怎么开。
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages 已启用，继续部署。"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages 尚未启用::在仓库 Settings → Pages → Source 选择 \"GitHub Actions\"，之后本工作流会自动开始部署（无需再改代码）。"
          fi

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 产物体检：宁可部署失败，也不要把一个「白屏站」发到线上。
      # 静态站最坏的失败形态就是这里 —— 页面能开、但功能全无，而且没人报错。
      - name: Verify web artifact is complete
        run: |
          set -e
          test -f web/index.html      || { echo "缺少 web/index.html"; exit 1; }
          test -f web/js/app.js       || { echo "缺少 web/js/app.js"; exit 1; }
          test -f web/js/engine.js    || { echo "缺少 web/js/engine.js"; exit 1; }
          test -f web/data/rules.js   || { echo "缺少 web/data/rules.js（词库产物，跑 scripts/export_web_rules.py）"; exit 1; }
          test -f web/css/style.css   || { echo "缺少 web/css/style.css"; exit 1; }
          # 词库产物至少要有点体积，空文件说明导出脚本没跑或跑挂了
          size=$(wc -c < web/data/rules.js)
          echo "web/data/rules.js = ${size} 字节"
          test "$size" -gt 10000 || { echo "web/data/rules.js 过小（${size} 字节），疑似导出失败"; exit 1; }

      # enablement: true —— 探测已通过，这里再带上它，顺带把 Pages 的
      # build_type 校正为 workflow（而不是"从分支部署"）。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
